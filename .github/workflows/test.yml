name: "Test: frontend & backend"

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'

  test-backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ISDOC schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run tests
        run: bun run test

  test-frontend:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # Aggregator so a single required status check works even when one suite is skipped.
  tests:
    name: Tests
    needs: [changes, test-backend, test-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          backend="${{ needs.test-backend.result }}"
          frontend="${{ needs.test-frontend.result }}"

          echo "backend=$backend frontend=$frontend"

          if [[ "$backend" == "failure" || "$frontend" == "failure" ]]; then
            exit 1
          fi
          if [[ "$backend" == "cancelled" || "$frontend" == "cancelled" ]]; then
            exit 1
          fi

          # At least one suite should run when this workflow is triggered.
          if [[ "$backend" != "success" && "$frontend" != "success" ]]; then
            echo "No test jobs succeeded"
            exit 1
          fi
