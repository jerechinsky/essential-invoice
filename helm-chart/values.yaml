# -- Service account configuration
# Useful for IAM Roles for Service Accounts (IRSA) on AWS or Workload Identity on GCP
serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- ServiceAccount name (auto-generated if empty)
  name: ""
  # -- Annotations to add to the ServiceAccount (e.g. eks.amazonaws.com/role-arn)
  annotations: {}

# -- Backend (Express API) configuration
backend:
  # -- Backend container image
  image:
    repository: ghcr.io/vdovhanych/essential-invoice/backend
    # -- Override with a specific version tag for production (e.g. "1.0.0")
    tag: latest
    pullPolicy: IfNotPresent

  # -- Number of backend replicas
  replicas: 1

  # -- Backend service port
  port: 3001

  # -- Backend service configuration
  service:
    # -- Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP

  # -- Deployment strategy
  strategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  # -- Additional pod annotations (e.g. for Prometheus scraping)
  podAnnotations: {}

  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  # -- Resource requests and limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # -- Environment variables for the backend
  env:
    NODE_ENV: production
    # -- Email polling interval in seconds (default: 10 minutes)
    EMAIL_POLLING_INTERVAL: "600"
    # -- Recurring invoice generation check interval in seconds (default: 24 hours)
    RECURRING_INVOICE_INTERVAL: "86400"
    # -- CORS allowed origin(s), comma-separated. With ingress (same-origin),
    # -- CORS is not needed and this value is ignored by browsers.
    # -- For cross-origin setups, set to your frontend URL (e.g. "https://invoices.example.com").
    CORS_ORIGIN: "*"
    # -- Frontend URL for constructing links in emails (password reset, etc.)
    # -- Set to your ingress URL in production (e.g. "https://invoices.example.com")
    FRONTEND_URL: ""

  # -- Global SMTP configuration for system emails (welcome, password reset)
  # -- These are separate from per-user SMTP settings configured in the app UI
  # -- To use, provide values directly or reference an existing secret via extraEnv/extraEnvFrom
  globalSmtp:
    # -- SMTP server host (leave empty to disable system emails)
    host: ""
    # -- SMTP server port
    port: "587"
    # -- SMTP username
    user: ""
    # -- SMTP password (prefer using existingSecret for production)
    password: ""
    # -- Use TLS (true/false)
    secure: "false"
    # -- Sender email address
    fromEmail: ""
    # -- Sender display name
    fromName: "essentialInvoice"

  # -- Additional environment variables as a list (for secrets, configmaps, etc.)
  # Example:
  #   - name: SMTP_HOST
  #     value: "smtp.example.com"
  #   - name: SMTP_PASSWORD
  #     valueFrom:
  #       secretKeyRef:
  #         name: smtp-secret
  #         key: password
  extraEnv: []

  # -- Additional envFrom sources (mount entire ConfigMaps/Secrets as env vars)
  # Example:
  #   - secretRef:
  #       name: smtp-credentials
  #   - configMapRef:
  #       name: app-config
  extraEnvFrom: []

  # -- Horizontal Pod Autoscaler configuration
  autoscaling:
    # -- Enable HPA for backend
    enabled: false
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 5
    # -- Target CPU utilization percentage
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage (optional)
    # targetMemoryUtilizationPercentage: 80

  # -- Pod Disruption Budget configuration
  pdb:
    # -- Enable PDB for backend
    enabled: false
    # -- Minimum number of pods that must be available
    minAvailable: 1
    # maxUnavailable: 1

  # -- Node selector for backend pods
  nodeSelector: {}

  # -- Tolerations for backend pods
  tolerations: []

  # -- Affinity rules for backend pods
  affinity: {}

# -- Frontend (Nginx + React SPA) configuration
frontend:
  # -- Frontend container image
  image:
    repository: ghcr.io/vdovhanych/essential-invoice/frontend
    # -- Override with a specific version tag for production (e.g. "1.0.0")
    tag: latest
    pullPolicy: IfNotPresent

  # -- Number of frontend replicas
  replicas: 1

  # -- Frontend service port
  port: 80

  # -- Frontend service configuration
  service:
    # -- Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP

  # -- Deployment strategy
  strategy: {}
    # type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  # -- Additional pod annotations
  podAnnotations: {}

  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101

  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Resource requests and limits
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # -- Horizontal Pod Autoscaler configuration
  autoscaling:
    # -- Enable HPA for frontend
    enabled: false
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 5
    # -- Target CPU utilization percentage
    targetCPUUtilizationPercentage: 80

  # -- Pod Disruption Budget configuration
  pdb:
    # -- Enable PDB for frontend
    enabled: false
    # -- Minimum number of pods that must be available
    minAvailable: 1

  # -- Node selector for frontend pods
  nodeSelector: {}

  # -- Tolerations for frontend pods
  tolerations: []

  # -- Affinity rules for frontend pods
  affinity: {}

# -- Ingress configuration
ingress:
  # -- Enable ingress resource
  enabled: false

  # -- Ingress class name (e.g. "nginx", "traefik")
  className: ""

  # -- Ingress annotations (e.g. cert-manager, nginx config)
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "55m"  # required for maximum-size batch expense imports

  # -- Hostname for the ingress
  host: ""

  # -- Path type for ingress rules (Prefix, Exact, ImplementationSpecific)
  pathType: Prefix

  # -- TLS configuration
  tls: []
  #  - secretName: essential-invoice-tls
  #    hosts:
  #      - invoice.example.com

# -- REQUIRED: JWT secret for backend authentication
# Generate with: openssl rand -base64 32
jwtSecret: ""

# -- REQUIRED: Encryption key for secrets at rest (SMTP/IMAP passwords, API keys)
# Must be a 64-character hex string (32 bytes). Generate with: openssl rand -hex 32
encryptionKey: ""

# -- Use an existing Kubernetes secret for JWT (and optional external DB credentials)
# The secret must contain: JWT_SECRET, ENCRYPTION_KEY
# When backend.globalSmtp.host is set, it must also contain: GLOBAL_SMTP_PASSWORD
# When postgresql.enabled=false (external DB), it must also contain: DB_PASSWORD
existingSecret: ""

# -- Image pull secrets for private registries needed for the included PostgreSQL chart
imagePullSecrets: []

# -- Override the full name of resources
fullnameOverride: ""

# -- Override the chart name
nameOverride: ""

# -- PostgreSQL configuration
postgresql:
  # -- Enable the built-in PostgreSQL StatefulSet
  enabled: true

  # -- PostgreSQL container image
  image:
    repository: dhi.io/postgres
    tag: "18"
    pullPolicy: IfNotPresent

  auth:
    # -- PostgreSQL database name
    database: essential_invoice
    # -- PostgreSQL username
    username: postgres
    # -- REQUIRED: PostgreSQL password (unless using auth.existingSecret)
    password: ""
    # -- Use an existing secret for PostgreSQL credentials
    # The secret must contain keys: POSTGRES_PASSWORD, POSTGRES_USER, POSTGRES_DB
    existingSecret: ""

  # -- Persistent storage configuration
  persistence:
    # -- Enable persistent storage for PostgreSQL
    enabled: true
    # -- Storage size for PostgreSQL PVC
    size: 5Gi
    # -- Storage class for PostgreSQL PVC (leave empty for default)
    storageClass: ""

  # -- Resource requests and limits for PostgreSQL
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # -- Additional environment variables for PostgreSQL
  extraEnv: []

  # -- Node selector for PostgreSQL pod
  nodeSelector: {}

  # -- Tolerations for PostgreSQL pod
  tolerations: []

  # -- External database connection (only used when postgresql.enabled=false)
  # Set postgresql.enabled=false and configure these:
  external:
    host: ""
    port: 5432
    database: essential_invoice
    username: postgres
    # -- Password for external database (or use existingSecret)
    password: ""
