name: essential-invoice

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.server}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.server}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.server}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.server}
      DB_USER: ${DB_USER:?Set DB_USER in .env.server}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.server}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.server}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env.server}
      CORS_ORIGIN: ${APP_URL:?Set APP_URL in .env.server}
      FRONTEND_URL: ${APP_URL:?Set APP_URL in .env.server}
      EMAIL_POLLING_INTERVAL: ${EMAIL_POLLING_INTERVAL:-600}
      RECURRING_INVOICE_INTERVAL: ${RECURRING_INVOICE_INTERVAL:-86400}
      GLOBAL_SMTP_HOST: ${GLOBAL_SMTP_HOST:-}
      GLOBAL_SMTP_PORT: ${GLOBAL_SMTP_PORT:-587}
      GLOBAL_SMTP_USER: ${GLOBAL_SMTP_USER:-}
      GLOBAL_SMTP_PASSWORD: ${GLOBAL_SMTP_PASSWORD:-}
      GLOBAL_SMTP_SECURE: ${GLOBAL_SMTP_SECURE:-false}
      GLOBAL_SMTP_FROM_EMAIL: ${GLOBAL_SMTP_FROM_EMAIL:-}
      GLOBAL_SMTP_FROM_NAME: ${GLOBAL_SMTP_FROM_NAME:-essentialInvoice}
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
  database:
    internal: true
